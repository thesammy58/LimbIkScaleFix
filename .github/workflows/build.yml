name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build Release | x86 with Visual Studio
        run: msbuild LimbIkScaleFix.slnx -p:Configuration=Release -p:Platform=x86 -m

      - name: Package
        shell: pwsh
        run: |
          $zip = "LimbIkScaleFix-$($env:GITHUB_REF_NAME -replace '/', '-').zip"
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path Release\LimbIkScaleFix.asi, LimbIkScaleFix.ini -DestinationPath "dist\$zip"
          Get-FileHash Release\LimbIkScaleFix.asi -Algorithm SHA256 | Format-List Hash, Path

      - uses: actions/upload-artifact@v4
        with:
          name: LimbIkScaleFix
          path: dist/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body: |
            **To install:** download `LimbIkScaleFix-${{ github.ref_name }}.zip` and copy `LimbIkScaleFix.asi` into `The Sims 3\Game\Bin`. The `.ini` is optional. You need an ASI loader; see the [README](https://github.com/${{ github.repository }}#install).

            Built from this tag by GitHub Actions with Visual Studio (Release | x86). This mod was made with AI (Claude); the README explains who did what.
