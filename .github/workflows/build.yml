name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build Release | x86 with Visual Studio
        run: msbuild LimbIkScaleFix.slnx -p:Configuration=Release -p:Platform=x86 -m

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item Release\LimbIkScaleFix.asi dist\
          Get-FileHash dist\LimbIkScaleFix.asi -Algorithm SHA256 | Format-List Hash, Path

      - uses: actions/upload-artifact@v4
        with:
          name: LimbIkScaleFix
          path: dist/LimbIkScaleFix.asi

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LimbIkScaleFix.asi
          body: |
            **To install:** download `LimbIkScaleFix.asi` and put it in `The Sims 3\Game\Bin`. You need an ASI loader; see the [README](https://github.com/${{ github.repository }}#install).

            Built from this tag by GitHub Actions with Visual Studio (Release | x86). This mod was made with AI (Claude); the README explains who did what.
