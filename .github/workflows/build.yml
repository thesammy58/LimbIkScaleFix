name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install 32-bit MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-i686-win32

      - name: Build
        run: ./build.sh

      - name: Package
        run: |
          cp README.md LICENSE dist/
          cd dist
          zip -9 "LimbIkScaleFix-${GITHUB_REF_NAME//\//-}.zip" LimbIkScaleFix.asi LimbIkScaleFix.ini LimbIkScaleFix.asi.sha256 README.md LICENSE

      - uses: actions/upload-artifact@v4
        with:
          name: LimbIkScaleFix
          path: dist/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body: |
            Built from this tag by GitHub Actions with 32-bit MinGW-w64 (see `build.sh`).
            SHA-256 of `LimbIkScaleFix.asi` is in `LimbIkScaleFix.asi.sha256` inside the zip and in the build log.
