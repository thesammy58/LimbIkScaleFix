name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang, LLD and 32-bit MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y clang lld g++-mingw-w64-i686-win32

      - name: Build
        run: ./build.sh

      - name: Package
        run: |
          cp README.md LICENSE dist/
          cd dist
          zip -9 "LimbIkScaleFix-${GITHUB_REF_NAME//\//-}.zip" LimbIkScaleFix.asi LimbIkScaleFix.pdb LimbIkScaleFix.ini SHA256SUMS.txt README.md LICENSE

      - uses: actions/upload-artifact@v4
        with:
          name: LimbIkScaleFix
          path: dist/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body: |
            Built from this tag by GitHub Actions with Clang and 32-bit MinGW-w64 (see `build.sh`).
            `LimbIkScaleFix.pdb` holds the debug symbols. SHA-256 hashes are in `SHA256SUMS.txt` inside the zip and in the build log.
