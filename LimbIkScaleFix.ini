; LimbIkScaleFix settings. Put this file next to LimbIkScaleFix.asi (optional; these are the defaults).
[LimbIkScaleFix]
; 1 = fix on at startup, 0 = off at startup (you can still turn it on with the hotkey)
Enabled=1
; 1 = Ctrl+Shift+K toggles the fix while the game window is focused (beeps: normal = ON, error = OFF)
ToggleHotkey=1
; 1 = write LimbIkScaleFix.log next to the .asi, 0 = don't write a log
Logging=1
